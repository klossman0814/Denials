ype: application/json\" -d '{\"username\":\"admin\",\"password\":\"admin123\"}' 2>/dev/null", "Bash=MSYS_NO_PATHCONV=1 docker exec denials-db-1 psql -U denials_user -d denials_db -t -c \"SELECT COUNT(*) FILTER (WHERE raw_content IS NOT NULL) || ' / ' || COUNT(*) FROM uploaded_files;\" 2>&1 | tr -d ' \\r' && echo \"--- round trip ---\" && FILE_ID=$(MSYS_NO_PATHCONV=1 docker exec denials-db-1 psql -U denials_user -d denials_db -t -c \"SELECT id FROM uploaded_files WHERE raw_content IS NOT NULL LIMIT 1;\" 2>&1 | tr -d ' \\r') && FNAME=$(MSYS_NO_PATHCONV=1 docker exec denials-db-1 psql -U denials_user -d denials_db -t -c \"SELECT filename FROM uploaded_files WHERE id='$FILE_ID';\" 2>&1 | tr -d ' \\r') && echo \"File: $FNAME\" && TOKEN=$(curl -s -X POST http://localhost:3003/api/auth/login -H \"Content-Type: application/json\" -d '{\"username\":\"admin\",\"password\":\"admin123\"}' 2>&1 | grep -o '\"token\":\"[^\"]*\"' | cut -d'\"' -f4) && curl -s \"http://localhost:3003/api/upload/files/$FILE_ID/raw\" -H \"Authorization: Bearer $TOKEN\" -o /tmp/rt.txt 2>&1 && for d in 835_processed 837_processed 835 837; do if [ -f \"C:/Denials/incoming/$d/$FNAME\" ]; then cmp -s \"C:/Denials/incoming/$d/$FNAME\" /tmp/rt.txt && echo \"BYTE-IDENTICAL ($d)\" || echo \"MISMATCH ($d)\"; break; fi; done", "Bash=cd \"C:/Denials\" && node -c backend/src/controllers/upload.controller.js 2>&1 && node -c backend/src/routes/upload.routes.js 2>&1 && docker compose restart backend 2>&1 && sleep 6 && TOKEN=$(curl -s -X POST http://localhost:3003/api/auth/login -H \"Content-Type: application/json\" -d '{\"username\":\"admin\",\"password\":\"admin123\"}' 2>&1 | grep -o '\"token\":\"[^\"]*\"' | cut -d'\"' -f4) && curl -s -o /dev/null -w \"raw endpoint HTTP %{http_code}\\n\" \"http://localhost:3003/api/upload/files/a36a409f-2288-4f33-9a27-5ea5ffffe730/raw\" -H \"Authorization: Bearer $TOKEN\" 2>&1", "Bash=cd \"C:/Denials\" && node -c backend/src/controllers/export.controller.js 2>&1 && docker compose restart backend 2>&1 && sleep 6 && TOKEN=$(curl -s -X POST http://localhost:3003/api/auth/login -H \"Content-Type: application/json\" -d '{\"username\":\"admin\",\"password\":\"admin123\"}' 2>&1 | grep -o '\"token\":\"[^\"]*\"' | cut -d'\"' -f4) && JOB=$(curl -s -m 30 -X POST \"http://localhost:3003/api/export/by-procedure\" -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" -d '{\"codes\":[\"36415\"],\"matchMode\":\"exact\",\"directory\":\"final-verify2\"}' 2>&1) && echo \"submit: $JOB\" && JOBID=$(echo \"$JOB\" | python -c \"import sys,json; print(json.load(sys.stdin)['jobId'])\") && sleep 10 && curl -s -m 30 \"http://localhost:3003/api/export/jobs/$JOBID\" -H \"Authorization: Bearer $TOKEN\" 2>&1 | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('status:', d.get('status'), '| done:', d.get('progress',{}).get('done'), '/', d.get('progress',{}).get('total'))\n\"", "Bash=sleep 25 && cd \"C:/Denials\" && echo \"835 on disk: $(ls extracts/final-verify2/835 2>/dev/null | wc -l)\"; echo \"837 on disk: $(ls extracts/final-verify2/837 2>/dev/null | wc -l)\" && TOKEN=$(curl -s -X POST http://localhost:3003/api/auth/login -H \"Content-Type: application/json\" -d '{\"username\":\"admin\",\"password\":\"admin123\"}' 2>&1 | grep -o '\"token\":\"[^\"]*\"' | cut -d'\"' -f4) && curl -s -m 30 \"http://localhost:3003/api/export/jobs/fdc4cf0f-1a8d-4a07-b697-e67061c6279c\" -H \"Authorization: Bearer $TOKEN\" 2>&1 | python -c \"\nimport sys,json\nd=json.load(sys.stdin)\nprint('status:', d.get('status'), '| done:', d.get('progress',{}).get('done'), '/', d.get('progress',{}).get('total'))\nif d.get('result'):\n    r=d['result']\n    print('total:', r.get('totalFiles'), '| 835:', r['summary']['835']['count'], '| 837:', r['summary']['837']['count'])\n\""]
